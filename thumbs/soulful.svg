    <circle cx="140" cy="210" r="10" fill="#ffb4d9"/><circle cx="680" cy="200" r="12" fill="#c9a7ff"/><circle cx="690" cy="400" r="10" fill="#ffb4d9"/><circle cx="120" cy="400" r="9" fill="#ffd28a"/>
